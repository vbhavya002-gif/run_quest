name: Build Windows app

# Builds RuneQuest.exe on GitHub. Run it from the Actions tab ("Run workflow")
# and download the file from the "Artifacts" section of the finished run.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name RuneQuest --icon icon.ico main.py
      - uses: actions/upload-artifact@v4
        with:
          name: RuneQuest-windows
          path: dist/RuneQuest.exe
